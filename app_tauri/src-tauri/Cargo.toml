[package]
name = "app_tauri"
version = "0.1.0"
description = "MoeJect - Modern Manga Reader & Downloader with AI Vision"
authors = ["MoeJect Team"]
edition = "2021"

[lib]
name = "app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ort = { version = "=2.0.0-rc.10", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
byteorder = "1.5"
futures = "0.3"
scraper = "0.22"

[features]
default = []
# Bật engine AI chạy trên máy (ONNX Runtime). Mặc định tắt để build thường không cần tải runtime.
local-ort = ["dep:ort"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
