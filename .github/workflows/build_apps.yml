name: Build MoeJect Apps (Tauri v2 Unified)

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows x64 (Tauri v2)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app_tauri/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: app_tauri
        run: npm install

      - name: Build Frontend
        working-directory: app_tauri
        run: npm run build

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app_tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('MoeJect {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoeJect-Windows-x64
          path: |
            app_tauri/src-tauri/target/release/app_tauri.exe
            app_tauri/src-tauri/target/release/bundle/msi/*.msi
            app_tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
