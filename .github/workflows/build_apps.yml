name: Build MoeJect Apps (Tauri v2 Unified)

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows x64 (Tauri v2)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app_tauri/package.json

      - name: Install Frontend Dependencies
        working-directory: app_tauri
        run: npm install

      - name: Build Tauri v2 Windows Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app_tauri
          tagName: v__VERSION__
          releaseName: 'MoeJect v__VERSION__'
          releaseBody: 'Phiên bản hợp nhất MoeJect (Tauri v2: Rust Core + React Frontend)'
          releaseDraft: false
          prerelease: false
