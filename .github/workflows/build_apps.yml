name: Build MoeJect Apps (Tauri v2 Unified)

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows x64 (Tauri v2)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app_tauri/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: app_tauri
        run: npm install

      - name: Build Frontend
        working-directory: app_tauri
        run: npm run build

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app_tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('MoeJect {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoeJect-Windows-x64
          path: |
            app_tauri/src-tauri/target/release/app_tauri.exe
            app_tauri/src-tauri/target/release/bundle/msi/*.msi
            app_tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-android:
    name: Build & Package Android APK (Tauri v2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Platform Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app_tauri/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: app_tauri
        run: npm install

      - name: Build Frontend
        working-directory: app_tauri
        run: npm run build

      - name: Init Android Target & Build Release APK
        working-directory: app_tauri
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64 --ci

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoeJect-Android-APK
          path: |
            app_tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
