[package]
name = "moeject-core"
version = "1.0.0"
edition = "2021"
authors = ["MoeJect Developers"]
description = "High-performance Rust Engine & Native GUI for MoeJect: Multi-source Scrapers, Parallel Downloader, CBZ/ZIP Packaging, and Axum REST API"

[lib]
name = "moeject_core"
path = "src/lib.rs"

[[bin]]
name = "moeject"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1.86"
futures = "0.3.31"

# Web Server & Networking
axum = { version = "0.8.1", features = ["macros"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["cors", "fs", "trace"] }
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "deflate", "multipart"] }

# Serialization
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
urlencoding = "2.1.3"

# Compression & Image
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
base64 = "0.22.1"
byteorder = "1.5.0"

# CLI & Utilities
clap = { version = "4.5.31", features = ["derive"] }
regex = "1.11.1"
uuid = { version = "1.13.1", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
anyhow = "1.0.95"
thiserror = "2.0.11"

# GUI Framework (100% Pure Rust)
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
egui_extras = { version = "0.37.0", features = ["all_loaders", "image"] }
rfd = "0.18"
open = "5.4"
